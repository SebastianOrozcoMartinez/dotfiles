source = ~/.cache/wal/colors-hyprland.conf
# BACKGROUND
background {
    monitor =
    path = ~/Pictures/Wallpapers/wallpaper.png
    blur_passes = 3
    contrast = 0.8916
    brightness = 0.8916
    vibrancy = 0.8916
    vibrancy_darkness = 0.0
}

# GENERAL
general {
}

# Profie-Photo
image {
    monitor =
    path = ~/Pictures/Wallpapers/logo2.0.png
    size = 100
    rounding = -1
    rotate = 0
    reload_time = -1
    reload_cmd = 
    position = 25, 200
    halign = center
    valign = center
}

# NAME
label {
    monitor =
    text = Sebas
    color = $foreground
    outline_thickness = 0
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    font_size = 22
    font_family = Google Sans Flex Bold
    position = 25, 110
    halign = center
    valign = center
}

# Time
label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date +"%I:%M")</span>"
    color = $foreground
    font_size = 65
    font_family = Google Sans Flex Bold
    position = 30, -8
    halign = center
    valign = center
}

# Day-Month-Date
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%A, %B %d")"
    color = $foreground
    font_size = 20
    font_family = Google Sans Flex
    position = 35, -60
    halign = center
    valign = center
}

# INPUT FIELD
input-field {
    monitor =
    size = 320, 55
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = $color8
    inner_color = rgba(17, 27, 40, 0.75)
    font_color = $foreground
    check_color = $color2
    fail_color = $color9
    fade_on_empty = false
    rounding = 10
    font_family = Google Sans Flex
    placeholder_text = <i><span foreground="##c3c6c999">  Password</span></i>
    hide_input = false
    position = 34, -120
    halign = center
    valign = center
}
